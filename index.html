<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пазл құрастыр! — 6 кезең</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f9ff;color:#182e55;font-family:'Times New Roman',serif}main{max-width:1250px;margin:auto;padding:10px}h1{text-align:center;font-size:clamp(26px,4vw,42px);margin:4px 0 10px}.stages{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 12px}.stages button{font:bold clamp(15px,1.6vw,21px) 'Times New Roman';border:2px solid #aabde9;background:#e8eeff;border-radius:10px;padding:8px 12px;color:#18335c;cursor:pointer}.stages button.active{background:#3256c6;color:white}.stages button.done{border-color:#27a86b}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}.pieces-panel{grid-column:1;grid-row:1}.board-panel{grid-column:2;grid-row:1}.panel{min-width:0;text-align:center}.panel h2{font-size:clamp(20px,2.6vw,29px);margin:2px 0 8px}.board{width:min(100%,490px);aspect-ratio:1;margin:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));background:white;border:3px solid #4869b0;border-radius:7px;overflow:hidden}.cell{position:relative;min-width:0;min-height:0;border:1px dashed #a9b8d9;cursor:pointer}.cell.good{border:1px solid #e3e9f5}.tile{width:100%;height:100%;background-repeat:no-repeat;background-size:400% 300%;pointer-events:none}.tray{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:10px;width:min(100%,490px);aspect-ratio:1;margin:auto}.piece{border:2px solid #9daed6;background:#fff;padding:0;position:relative;min-width:0;min-height:0;overflow:hidden;border-radius:8px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}.piece .tile{display:block}.piece.chosen{border:4px solid #f08c2a;box-shadow:0 0 0 2px #ffd78b}.piece.used{visibility:hidden}.piece:active{cursor:grabbing}.ghost{position:fixed;z-index:50;pointer-events:none;border:3px solid #f59e0b;border-radius:8px;overflow:hidden;background:white;box-shadow:0 8px 24px #0005;opacity:.95}.ghost .tile{width:100%;height:100%}.nav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:15px 0}.nav button,.overlay button{font:bold 21px 'Times New Roman';padding:11px 20px;border:0;border-radius:11px;background:#3156c5;color:white;cursor:pointer}.nav button:disabled{opacity:.3}.hint{text-align:center;font-size:18px;margin:10px 0}.overlay{position:fixed;inset:0;background:#071b3ba8;z-index:100;display:none;align-items:center;justify-content:center}.overlay.show{display:flex}.celebrate{position:relative;overflow:hidden;min-width:min(90vw,430px);background:white;padding:25px;border-radius:23px;text-align:center;box-shadow:0 15px 55px #0005}.letter{font:bold clamp(120px,23vw,200px) 'Times New Roman';color:#df315d}.praise{font:bold clamp(36px,8vw,64px) 'Times New Roman';color:#15905c;display:none}.confetti{position:absolute;inset:0;pointer-events:none}.confetti i{position:absolute;top:-25px;width:10px;height:17px;animation:fall 1.8s linear infinite}@keyframes fall{to{transform:translateY(510px) rotate(720deg)}}@media(max-width:700px){main{padding:6px}.layout{grid-template-columns:1fr;gap:10px}.pieces-panel{grid-column:1;grid-row:1}.board-panel{grid-column:1;grid-row:2}.board{width:min(92vw,370px)}.tray{width:min(92vw,370px);gap:6px}.panel h2{font-size:21px;margin:3px 0 5px}.stages button{padding:6px 9px}.nav button{font-size:18px;padding:9px 13px}.hint{font-size:16px;margin:8px 0}}
</style></head><body><main><h1>🧩 Пазл құрастыр!</h1><div id="stages" class="stages"></div><div class="layout"><section class="panel board-panel"><h2>Пазлды құрастыр</h2><div id="board" class="board"></div></section><section class="panel pieces-panel"><h2>Араласқан бөлшектер</h2><div id="tray" class="tray"></div></section></div><p class="hint">Бір бөлшекті сүйреп орнына қой немесе бөлшекті, содан соң бос орынды бас.</p><div class="nav"><button id="prev">← Алдыңғы кезең</button><button id="next">Келесі кезең →</button></div></main><div class="overlay" id="overlay"><div class="celebrate"><div id="confetti" class="confetti"></div><div id="letter" class="letter"></div><div id="praise" class="praise">ЖАРАЙСЫҢ! 🎉</div><button id="close">Жалғастыру</button></div></div><script>
const data=[['Алма','А'],['Қоян','Қ'],['Жүзім','Ж'],['Күн','К'],['Балық','Б'],['Көбелек','К']];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const states=data.map(()=>({placed:Array(12).fill(false),order:shuffle(Array.from({length:12},(_,i)=>i)),celebrated:false}));let stage=0,selected=null,drag=null,modalTimer=null,celebrateTimer=null,autoTimer=null,audioCtx;
const $=id=>document.getElementById(id);
function tile(k){const x=k%4,y=Math.floor(k/4);return `<span class="tile" style="display:block;background-image:url('assets/${stage+1}.jpg');background-position:${x*100/3}% ${y*50}%"></span>`}
function render(){const s=states[stage];$('stages').innerHTML=data.map((d,i)=>`<button class="${stage===i?'active':''} ${states[i].placed.every(Boolean)?'done':''}" data-stage="${i}">${i+1}. ${d[0]}${states[i].placed.every(Boolean)?' ✓':''}</button>`).join('');$('board').innerHTML=s.placed.map((yes,k)=>`<div class="cell ${yes?'good':''}" data-cell="${k}">${yes?tile(k):''}</div>`).join('');$('tray').innerHTML=s.order.map(k=>`<button type="button" class="piece ${s.placed[k]?'used':''} ${selected===k?'chosen':''}" data-piece="${k}" aria-label="${k+1}-бөлшек">${tile(k)}</button>`).join('');$('prev').disabled=stage===0;$('next').disabled=stage===5}
function selectPiece(k){if(states[stage].placed[k])return;selected=k;document.querySelectorAll('.piece').forEach(el=>el.classList.toggle('chosen',Number(el.dataset.piece)===k))}
function place(k,p=selected){const s=states[stage];if(p===null||s.placed[k]||s.placed[p])return;if(k!==p){beep(false);const cell=document.querySelector(`[data-cell="${k}"]`);cell?.animate([{background:'#ffb7b7'},{background:'transparent'}],{duration:350});return} s.placed[k]=true;selected=null;beep(true);render();if(s.placed.every(Boolean)&&!s.celebrated){s.celebrated=true;const completedStage=stage;celebrateTimer=setTimeout(()=>{if(stage===completedStage)celebrate()},450)}}
$('stages').addEventListener('click',e=>{const b=e.target.closest('[data-stage]');if(b)go(Number(b.dataset.stage))});$('board').addEventListener('click',e=>{const c=e.target.closest('[data-cell]');if(c)place(Number(c.dataset.cell))});
$('tray').addEventListener('pointerdown',e=>{const b=e.target.closest('[data-piece]');if(!b||b.classList.contains('used'))return;const k=Number(b.dataset.piece);selectPiece(k);const r=b.getBoundingClientRect();drag={id:e.pointerId,k,startX:e.clientX,startY:e.clientY,w:r.width,h:r.height,ghost:null};b.setPointerCapture(e.pointerId);e.preventDefault()});
$('tray').addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const d=drag;if(!d.ghost&&Math.hypot(e.clientX-d.startX,e.clientY-d.startY)<7)return;if(!d.ghost){d.ghost=document.createElement('div');d.ghost.className='ghost';d.ghost.style.width=d.w+'px';d.ghost.style.height=d.h+'px';d.ghost.innerHTML=tile(d.k);document.body.appendChild(d.ghost)}d.ghost.style.left=(e.clientX-d.w/2)+'px';d.ghost.style.top=(e.clientY-d.h/2)+'px'});
function finishDrag(e){if(!drag||drag.id!==e.pointerId)return;const d=drag;drag=null;if(d.ghost){d.ghost.remove();const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-cell]');if(el)place(Number(el.dataset.cell),d.k)}}$('tray').addEventListener('pointerup',finishDrag);$('tray').addEventListener('pointercancel',e=>{if(drag){drag.ghost?.remove();drag=null}});$('tray').addEventListener('click',e=>{const b=e.target.closest('[data-piece]');if(b)selectPiece(Number(b.dataset.piece))});
function go(i){clearTimeout(modalTimer);clearTimeout(celebrateTimer);clearTimeout(autoTimer);$('overlay').classList.remove('show');stage=i;selected=null;render()}$('prev').onclick=()=>go(Math.max(0,stage-1));$('next').onclick=()=>go(Math.min(data.length-1,stage+1));$('close').onclick=()=>{clearTimeout(modalTimer);clearTimeout(autoTimer);if(stage<data.length-1)go(stage+1);else $('overlay').classList.remove('show')};
function tone(f,delay,duration){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+delay;o.type='sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+duration+.01)}catch(err){}}function beep(ok){tone(ok?660:210,0,.14);if(ok)tone(880,.12,.17)}
function celebrate(){const l=$('letter'),p=$('praise');l.textContent=data[stage][1];l.style.display='block';p.style.display='none';$('overlay').classList.add('show');const colors=['#f33','#fc3','#4b9','#49f','#a4f'];$('confetti').innerHTML=Array.from({length:50},(_,i)=>`<i style="left:${Math.random()*100}%;background:${colors[i%5]};animation-delay:${Math.random()*1.7}s;animation-duration:${1+Math.random()*1.5}s"></i>`).join('');modalTimer=setTimeout(()=>{l.style.display='none';p.style.display='block';[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.15,.24));const finishedStage=stage;if(finishedStage<data.length-1){autoTimer=setTimeout(()=>{if(stage===finishedStage)go(finishedStage+1)},2700)}else{$('close').textContent='Аяқтау'}} ,1400)}render();
</script></body></html>
